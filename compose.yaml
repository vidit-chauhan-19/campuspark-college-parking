services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: college_parking
      MYSQL_USER: campuspark
      MYSQL_PASSWORD: ${CAMPUSPARK_DB_PASSWORD:?Set CAMPUSPARK_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - campuspark-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CAMPUSPARK_DB_URL: jdbc:mysql://db:3306/college_parking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      CAMPUSPARK_DB_USER: campuspark
      CAMPUSPARK_DB_PASSWORD: ${CAMPUSPARK_DB_PASSWORD:?Set CAMPUSPARK_DB_PASSWORD in .env}
    ports:
      - "8080:8080"

volumes:
  campuspark-data:
